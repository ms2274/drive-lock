name: DriveLock
options:
  bundleIdPrefix: com.michaelscardena
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: 7MP9JX7CM4
targets:
  DriveLock:
    type: application
    platform: iOS
    sources: [DriveLock, Shared]
    dependencies:
      - target: DriveLockMonitor
      - target: DriveLockShield
    entitlements:
      path: DriveLock/Resources/DriveLock.entitlements
      properties:
        com.apple.developer.family-controls: true
        com.apple.security.application-groups: [group.com.michaelscardena.drivelock]
    info:
      path: DriveLock/Resources/Info.plist
      properties:
        CFBundleDisplayName: DriveLock
        UILaunchScreen: {}
        UIBackgroundModes: [location, processing]
        BGTaskSchedulerPermittedIdentifiers: [com.michaelscardena.drivelock.refresh]
        NSMotionUsageDescription: DriveLock uses motion data to tell when you are in a vehicle, so it can shield distracting apps while you drive.
        NSLocationWhenInUseUsageDescription: DriveLock uses your location to measure driving speed and trip distance.
        NSLocationAlwaysAndWhenInUseUsageDescription: DriveLock needs background location to notice when a drive starts, even when the app is closed. Location stays on your device.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.michaelscardena.drivelock
    scheme:
      testTargets: [DriveLockTests]
  DriveLockTests:
    type: bundle.unit-test
    platform: iOS
    sources: [DriveLockTests]
    dependencies:
      - target: DriveLock
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.michaelscardena.drivelock.tests
        GENERATE_INFOPLIST_FILE: YES
  DriveLockMonitor:
    type: app-extension
    platform: iOS
    sources: [DriveLockMonitor, Shared]
    info:
      path: DriveLockMonitor/Info.plist
      properties:
        CFBundleDisplayName: DriveLockMonitor
        NSExtension:
          NSExtensionPointIdentifier: com.apple.deviceactivity.monitor-extension
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).DriveSafetyMonitor
    entitlements:
      path: DriveLockMonitor/DriveLockMonitor.entitlements
      properties:
        com.apple.developer.family-controls: true
        com.apple.security.application-groups: [group.com.michaelscardena.drivelock]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.michaelscardena.drivelock.monitor
  DriveLockShield:
    type: app-extension
    platform: iOS
    sources: [DriveLockShield, Shared]
    info:
      path: DriveLockShield/Info.plist
      properties:
        CFBundleDisplayName: DriveLockShield
        NSExtension:
          NSExtensionPointIdentifier: com.apple.ManagedSettingsUI.shield-configuration-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).DriveShieldConfiguration
    entitlements:
      path: DriveLockShield/DriveLockShield.entitlements
      properties:
        com.apple.developer.family-controls: true
        com.apple.security.application-groups: [group.com.michaelscardena.drivelock]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.michaelscardena.drivelock.shield
